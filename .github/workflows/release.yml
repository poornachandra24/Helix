name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
            archive_ext: "tar.gz"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            archive_ext: "tar.gz"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
            archive_ext: "zip"

    env:
      HF_HOME: ${{ github.workspace }}/.hf_cache
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Disable Windows Defender
        if: matrix.os == 'windows-latest'
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
        shell: powershell
      - name: Install OpenBLAS & gfortran (Linux Only)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev gfortran

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release

      - name: Build Target Release Binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Verify Binary Execution
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./target/${{ matrix.target }}/release/helix.exe --version
          else
            ./target/${{ matrix.target }}/release/helix --version
          fi

      - name: Prepare Binary Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          cp ../../../LICENSE .
          cp ../../../README.md .
          tar -czf ../../../helix-${{ matrix.target }}.tar.gz helix LICENSE README.md
          cd ../../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum helix-${{ matrix.target }}.tar.gz > helix-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 helix-${{ matrix.target }}.tar.gz > helix-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Prepare Binary Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Copy-Item ../../../LICENSE .
          Copy-Item ../../../README.md .
          Compress-Archive -Path helix.exe, LICENSE, README.md -DestinationPath ../../../helix-${{ matrix.target }}.zip
          cd ../../..
          $hash = (Get-FileHash helix-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  helix-${{ matrix.target }}.zip" | Out-File -FilePath helix-${{ matrix.target }}.zip.sha256 -Encoding ascii

      - name: Upload Build Archive
        uses: actions/upload-artifact@v4
        with:
          name: helix-archive-${{ matrix.target }}
          path: helix-${{ matrix.target }}.${{ matrix.archive_ext }}

      - name: Upload Checksum
        uses: actions/upload-artifact@v4
        with:
          name: helix-checksum-${{ matrix.target }}
          path: helix-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: helix-*
          path: artifacts

      - name: Rearrange Artifacts for Upload
        run: |
          mkdir -p release_files
          find artifacts -name "helix-*" -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Extract Release Notes from Changelog
        run: |
          python3 -c '
          import re, os
          tag = "${{ github.ref_name }}"
          version = tag.lstrip("v")
          written = False
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r") as f:
                  content = f.read()
              pattern = rf"(## \[{re.escape(version)}\].*?)(?=\n## \[|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
                  if notes.endswith("---"):
                      notes = notes[:-3].strip()
                  with open("release_notes.md", "w") as out:
                      out.write(notes)
                  written = True
          if not written:
              with open("release_notes.md", "w") as out:
                  out.write("Release " + tag)
          '

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_files/*.tar.gz
            release_files/*.zip
            release_files/*.sha256
          draft: false
          prerelease: false
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Tag Version
        id: get_version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/helix:latest
            ghcr.io/${{ github.repository_owner }}/helix:${{ steps.get_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Docker Image Execution
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/helix:${{ steps.get_version.outputs.version }} --version
