name: Continuous Integration

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  detect-changes:
    name: Detect Documentation-Only Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run check-docs-only script
        id: check
        run: |
          # Determine the base ref
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="${{ github.event.before }}"
          fi
          
          # If base ref is empty or zeroes, default to HEAD~1
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD~1"
          fi
          
          echo "Using base reference: $BASE_REF"
          
          # Run script and write output to GITHUB_OUTPUT
          RESULT=$(./scripts/check_docs_only.sh "$BASE_REF" | tail -n 1)
          if [ "$RESULT" = "docs_only=true" ]; then
            echo "docs_only=true" >> $GITHUB_OUTPUT
            echo "Documentation/comment changes detected. Skipping full CI build."
          else
            echo "docs_only=false" >> $GITHUB_OUTPUT
            echo "Code changes detected. Proceeding with CI."
          fi

  check-format:
    name: Code Formatting Check
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

  security-audit:
    name: Security Vulnerability Audit
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Cargo Audit
        uses: actions-rust-lang/audit@v1

  clippy:
    name: Clippy Linter Check
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Disable Windows Defender
        if: matrix.os == 'windows-latest'
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
        shell: powershell

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install OpenBLAS & gfortran (Linux Only)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev gfortran

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-clippy

      - name: Fix clang_rt link path (macOS / Xcode 16.x)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          # Xcode 16.x moved clang runtime to a versioned subdir (e.g. 17.0.0/)
          # but some crate build scripts still search the short path (17/).
          # Find the actual library and expose its directory via RUSTFLAGS.
          CLANG_RT=$(clang -print-file-name=libclang_rt.osx.a 2>/dev/null || echo "")
          if [ -n "$CLANG_RT" ] && [ -f "$CLANG_RT" ]; then
            RT_DIR=$(dirname "$CLANG_RT")
            echo "RUSTFLAGS=-L $RT_DIR" >> $GITHUB_ENV
            echo "clang runtime dir: $RT_DIR"
          else
            echo "libclang_rt.osx.a not found via clang -print-file-name; skipping patch"
          fi

      - name: Run Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Run Unit & Integration Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      HF_HOME: ${{ github.workspace }}/.hf_cache
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Disable Windows Defender
        if: matrix.os == 'windows-latest'
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
        shell: powershell

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install OpenBLAS & gfortran (Linux Only)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev gfortran

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-test

      - name: Cache HuggingFace Models
        uses: actions/cache@v6
        with:
          path: .hf_cache
          key: ${{ runner.os }}-hf-models-v1

      - name: Setup Test Directories
        shell: bash
        run: mkdir -p wasm_jail

      - name: Fix clang_rt link path (macOS / Xcode 16.x)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          # Xcode 16.x moved clang runtime to a versioned subdir (e.g. 17.0.0/)
          # but some crate build scripts still search the short path (17/).
          # Find the actual library and expose its directory via RUSTFLAGS.
          CLANG_RT=$(clang -print-file-name=libclang_rt.osx.a 2>/dev/null || echo "")
          if [ -n "$CLANG_RT" ] && [ -f "$CLANG_RT" ]; then
            RT_DIR=$(dirname "$CLANG_RT")
            echo "RUSTFLAGS=-L $RT_DIR" >> $GITHUB_ENV
            echo "clang runtime dir: $RT_DIR"
          else
            echo "libclang_rt.osx.a not found via clang -print-file-name; skipping patch"
          fi

      - name: Run Test Suite
        run: cargo test --all-targets --all-features
